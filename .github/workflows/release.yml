name: Release

# Pushing a tag such as v0.1.0 publishes that version to npm, with
# provenance, and writes the GitHub release notes with the script tag, its
# integrity hash and the feat, fix and breaking commits since the last
# release. npm refuses while package.json is still private.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # All history and tags, to list the commits since the last release.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Use the npm version devEngines asks for
        run: |
          version=$(node -p "require('./package.json').devEngines.packageManager.version")
          cd "$RUNNER_TEMP" && npm install -g "npm@$version"
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but package.json says $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create the GitHub release
        run: |
          npm run size --silent > "$RUNNER_TEMP/notes.md"
          node scripts/release-commits.mjs >> "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
